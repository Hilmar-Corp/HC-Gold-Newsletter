[project]
name = "hc-gold-newsletter"
version = "1.0.0"
description = "Reproducible HilmarCorp research comparing Bitcoin and gold across macro-financial environments."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    ".venv",
    "outputs",
    "reproduction",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]
